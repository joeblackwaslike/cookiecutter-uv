[project]
name = "create-py-project"
version = "0.1.0"
description = "Scaffold and maintain production-ready Python projects with a rich CLI and Claude Code plugin."
authors = [{ name = "Joe Black", email = "me@joeblack.nyc" }]
readme = "README.md"
keywords = ['python', 'scaffold', 'cli', 'template', 'uv', 'cookiecutter']
requires-python = ">=3.9,<4.0"
dependencies = [
  "cookiecutter>=2.1.1",
  "typer[all]>=0.12",
  "questionary>=2.0",
  "pydantic>=2.0",
  "tomlkit>=0.12",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Code Generators",
]

[project.scripts]
create-py-project = "create_py_project.cli:app"

[project.urls]
Repository = "https://github.com/joeblackwaslike/create-py-project"
Documentation = "https://joeblackwaslike.github.io/create-py-project/"
Homepage = "https://joeblackwaslike.github.io/create-py-project/"

[dependency-groups]
dev = [
    "pytest>=7.2.0",
    "pre-commit>=2.20.0",
    "pytest-cookies>=0.6.1",
    "tox-uv>=1.11.3",
    "deptry>=0.22.0",
    "mypy>=0.991",
    "pytest-cov>=4.0.0",
    "ruff>=0.9.2",
]

[tool.uv]
package = true

[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.report]
skip_empty = true

[tool.coverage.run]
branch = true
source = ["create_py_project"]

[tool.mypy]
files = ['src/create_py_project']
disallow_untyped_defs = true
disallow_any_unimported = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true

[tool.deptry]
extend_exclude = [
  ".+/test_foo.py"
]

[tool.deptry.per_rule_ignores]
DEP002 = ["cookiecutter"]
DEP003 = ["create_py_project", "rich"]

[tool.ruff]
target-version = "py39"
line-length = 120
fix = true
exclude = ["[{][{]cookiecutter*"]

[tool.ruff.lint]
select = [
    # flake8-2020
    "YTT",
    # flake8-bandit
    "S",
    # flake8-bugbear
    "B",
    # flake8-builtins
    "A",
    # flake8-comprehensions
    "C4",
    # flake8-debugger
    "T10",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # mccabe
    "C90",
    # pycodestyle
    "E", "W",
    # pyflakes
    "F",
    # pygrep-hooks
    "PGH",
    # pyupgrade
    "UP",
    # ruff
    "RUF",
    # tryceratops
    "TRY",
]
ignore = [
    # LineTooLong
    "E501",
    # DoNotAssignLambda
    "E731",
    # TooComplex
    "C901",
    # AvoidSpecifyingLongMessagesOutsideExceptionClass
    "TRY003",
    # ConsiderMovingToElseBlock
    "TRY300",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S603"]
"src/create_py_project/*" = ["S603", "S607"]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

name: release-main (manual fallback)

# NOTE: Automatic docs deploy on release now lives in release-please.yml
# (releases created by GITHUB_TOKEN do not trigger `on: release` workflows).
# This workflow is kept as a manual fallback only.
on:
  workflow_dispatch:

jobs:
  deploy-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      - name: Deploy documentation
        run: uv run mkdocs gh-deploy --force

name: Main

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      - name: Run pre-commit
        run: uv run pre-commit run -a --show-diff-on-failure

      - name: Inspect dependencies
        run: uv run deptry .

      - name: Check lock file consistency
        run: uv sync --locked

  tests-and-type-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
      fail-fast: false
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: uv run python -m pytest tests --cov --cov-config=pyproject.toml --cov-report=xml

      - name: Check typing
        run: uv run mypy

      - name: Upload coverage reports to Codecov with GitHub Action on Python 3.11 for Ubuntu
        uses: codecov/codecov-action@ab904c41d6ece82784817410c45d8b8c02684457 # v3
        if: ${{ matrix.python-version == '3.11' }}

  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      - name: Build distributions
        run: uv build

      - name: Smoke-test the built wheel in a clean venv
        env:
          # Use this PR's checked-out template (offline, deterministic) instead of
          # the published gh: remote, which isn't available until the repo rename.
          SPINUP_PY_TEMPLATE: ${{ github.workspace }}
        run: |
          set -euo pipefail
          git config --global user.email "ci@example.com"
          git config --global user.name "spinup-py CI"
          git config --global init.defaultBranch main
          wheel="$(ls dist/*.whl)"
          test "$(printf '%s\n' "$wheel" | wc -l)" -eq 1
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet "$wheel"
          /tmp/smoke/bin/spinup-py --version
          /tmp/smoke/bin/spinup-py --help
          /tmp/smoke/bin/spinup-py new --help
          /tmp/smoke/bin/spinup-py update --help
          workdir="$(mktemp -d)"
          ( cd "$workdir" && /tmp/smoke/bin/spinup-py smoketest-proj --non-interactive )
          test -f "$workdir/smoketest-proj/pyproject.toml"
          test -d "$workdir/smoketest-proj/src/smoketest_proj"
          test -d "$workdir/smoketest-proj/tests"
          echo "smoke OK"

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist-smoke
          path: dist/
